# ---------------------------------------------------------------------------
# CD — Frontend
#
# Trigger: automatic on successful `ci-frontend` run on main.
# Uses pipeline resource `ciFrontend.sourceCommit` for exact source checkout.
# Builds, scans (Trivy CRITICAL), pushes to ACR, canary deploys via
# `frontend-deploy.sh` using Argo Rollouts + Playwright + k6.
# No CI artifact handoff; image tag = sourceCommit SHA.
# ---------------------------------------------------------------------------

trigger: none

resources:
  pipelines:
    - pipeline: ciFrontend
      source: ci-frontend
      trigger:
        branches:
          include:
            - main

variables:
  - group: terraform-vars
  - name: frontendNamespace
    value: "task-api"
  - name: argoRolloutsVersion
    value: "1.8.4"
  - name: k6Version
    value: "2.1.0"

pool:
  vmImage: "ubuntu-24.04"

stages:
  - stage: build
    displayName: "Build, scan and push frontend image"
    condition: and(succeeded(), eq(variables['resources.pipeline.ciFrontend.sourceBranch'], 'refs/heads/main'))
    jobs:
      - job: build_push
        displayName: "Build / Trivy scan / push"
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            fetchTags: false
            persistCredentials: false
            submodules: false
            lfs: false

          - bash: |
              set -euo pipefail

              commit="$(resources.pipeline.ciFrontend.sourceCommit)"

              test -n "$commit"
              [[ "$commit" =~ ^[0-9a-f]{40}$ ]]

              git -c "http.extraheader=AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
                fetch --no-tags --depth=1 origin "$commit"

              git checkout --detach "$commit"

              test "$(git rev-parse HEAD)" = "$commit"
            displayName: "Checkout exact CI source commit"
            env:
              SYSTEM_ACCESSTOKEN: "$(System.AccessToken)"

          - template: azure-pipelines/templates/docker-build-push.yaml
            parameters:
              dockerfilePath: "services/frontend/Dockerfile"
              contextPath: "services/frontend"
              imageRepository: "frontend"
              imageTag: "$(resources.pipeline.ciFrontend.sourceCommit)"
              containerRegistry: "$(containerRegistry)"
              azureSubscription: "azdo-oidc-cd"

  - stage: deploy
    displayName: "Canary deploy frontend"
    dependsOn: build
    condition: succeeded()
    jobs:
      - deployment: canary_deploy
        displayName: "Progressive frontend canary"
        environment: "staging"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                  fetchDepth: 1
                  fetchTags: false
                  persistCredentials: false
                  submodules: false
                  lfs: false

                - bash: |
                    set -euo pipefail

                    commit="$(resources.pipeline.ciFrontend.sourceCommit)"

                    test -n "$commit"
                    [[ "$commit" =~ ^[0-9a-f]{40}$ ]]

                    git -c "http.extraheader=AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
                      fetch --no-tags --depth=1 origin "$commit"

                    git checkout --detach "$commit"

                    test "$(git rev-parse HEAD)" = "$commit"
                  displayName: "Checkout exact CI source commit"
                  env:
                    SYSTEM_ACCESSTOKEN: "$(System.AccessToken)"

                - bash: |
                    set -euo pipefail

                    version="$(argoRolloutsVersion)"
                    work="$(Agent.TempDirectory)/argo-rollouts"
                    archive="kubectl-argo-rollouts-linux-amd64"
                    checksums="argo-rollouts-checksums.txt"
                    base_url="https://github.com/argoproj/argo-rollouts/releases/download/v${version}"

                    mkdir -p "$work"

                    curl \
                      --fail \
                      --silent \
                      --show-error \
                      --location \
                      --retry 3 \
                      --retry-all-errors \
                      --connect-timeout 10 \
                      --proto '=https' \
                      --tlsv1.2 \
                      -o "$work/$archive" \
                      "$base_url/$archive"

                    curl \
                      --fail \
                      --silent \
                      --show-error \
                      --location \
                      --retry 3 \
                      --retry-all-errors \
                      --connect-timeout 10 \
                      --proto '=https' \
                      --tlsv1.2 \
                      -o "$work/$checksums" \
                      "$base_url/$checksums"

                    cd "$work"

                    checksum_line="$(
                      grep -E \
                        '^[0-9a-f]{64}[[:space:]]+[*]?kubectl-argo-rollouts-linux-amd64$' \
                        "$checksums"
                    )"

                    test -n "$checksum_line"

                    printf '%s\n' "$checksum_line" | sha256sum --check --status -

                    chmod +x "$archive"
                    sudo install -m 0755 "$archive" /usr/local/bin/kubectl-argo-rollouts

                    kubectl argo rollouts version
                  displayName: "Install pinned Argo Rollouts plugin"

                - bash: |
                    set -euo pipefail

                    version="$(k6Version)"
                    work="$(Agent.TempDirectory)/k6"
                    archive="k6-v${version}-linux-amd64.tar.gz"
                    checksums="k6-v${version}-checksums.txt"
                    base_url="https://github.com/grafana/k6/releases/download/v${version}"

                    mkdir -p "$work"

                    curl \
                      --fail \
                      --silent \
                      --show-error \
                      --location \
                      --retry 3 \
                      --retry-all-errors \
                      --connect-timeout 10 \
                      --proto '=https' \
                      --tlsv1.2 \
                      -o "$work/$archive" \
                      "$base_url/$archive"

                    curl \
                      --fail \
                      --silent \
                      --show-error \
                      --location \
                      --retry 3 \
                      --retry-all-errors \
                      --connect-timeout 10 \
                      --proto '=https' \
                      --tlsv1.2 \
                      -o "$work/$checksums" \
                      "$base_url/$checksums"

                    cd "$work"

                    checksum_line="$(
                      grep -E \
                        '^[0-9a-f]{64}[[:space:]]+[*]?k6-v'"${version}"'-linux-amd64\.tar\.gz$' \
                        "$checksums"
                    )"

                    test -n "$checksum_line"

                    printf '%s\n' "$checksum_line" | sha256sum --check --status -

                    tar -xzf "$archive"

                    test -x "$work/k6-v${version}-linux-amd64/k6"
                    sudo install -m 0755 \
                      "$work/k6-v${version}-linux-amd64/k6" \
                      /usr/local/bin/k6

                    k6 version
                  displayName: "Install pinned k6"

                - task: AzureCLI@2
                  displayName: "Canary deploy frontend"
                  inputs:
                    azureSubscription: "azdo-oidc-cd"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      az aks get-credentials \
                        --resource-group "$(aksResourceGroup)" \
                        --name "$(aksClusterName)" \
                        --overwrite-existing

                      export NAMESPACE="$(frontendNamespace)"
                      export IMAGE_REPO="$(containerRegistry).azurecr.io/frontend"
                      export K6_BIN="k6"

                      IMAGE="$(containerRegistry).azurecr.io/frontend:$(resources.pipeline.ciFrontend.sourceCommit)"

                      bash azure-pipelines/scripts/frontend-deploy.sh \
                        --canary \
                        --image "$IMAGE" \
                        --qps 2 \
                        --p95-threshold 20000 \
                        --error-threshold 0.05 \
                        --duration 15s \
                        --observation-duration 15s
