# ---------------------------------------------------------------------------
# CI — Frontend
#
# Trigger: services/frontend/** changes on main or feat/*
# Validates source only: npm ci, TypeScript, ESLint, Vite production build
# Does NOT build or push Docker images; CD owns image creation.
# No secrets required.
# ---------------------------------------------------------------------------

trigger:
  batch: true
  branches:
    include:
      - main
      - feat/*
  paths:
    include:
      - services/frontend/**
      - azure-pipelines/ci/ci-frontend.yaml
      - azure-pipelines/templates/**
      - azure-pipelines/scripts/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - services/frontend/**
      - azure-pipelines/ci/ci-frontend.yaml
      - azure-pipelines/templates/**
      - azure-pipelines/scripts/**

pool:
  vmImage: "ubuntu-24.04"

variables:
  - name: npm_config_cache
    value: "$(Pipeline.Workspace)/.npm"

steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    fetchTags: false
    persistCredentials: false
    submodules: false
    lfs: false

  - task: UseNode@1
    displayName: "Use Node.js 24.20.0"
    inputs:
      version: "24.20.0"
      checkLatest: false

  - bash: |
      set -euo pipefail
      node --version
      npm --version
    displayName: "Preflight hosted agent"

  - task: Cache@2
    displayName: "Cache npm package cache"
    inputs:
      key: 'npm | "$(Agent.OS)" | services/frontend/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: "$(npm_config_cache)"

  - bash: |
      set -euo pipefail
      cd services/frontend
      test -f package-lock.json
      npm ci --cache "$(npm_config_cache)" --prefer-offline
    displayName: "Install frontend dependencies"

  - bash: |
      set -euo pipefail
      cd services/frontend
      npx --no-install tsc --noEmit
    displayName: "TypeScript type check"

  - bash: |
      set -euo pipefail
      cd services/frontend
      npm run lint
    displayName: "Lint frontend"

  - bash: |
      set -euo pipefail
      cd services/frontend
      npm run build
    displayName: "Build frontend for production"
