# ---------------------------------------------------------------------------
# CI — Backend
#
# Trigger: services/backend/** changes on main or feat/*
# Validates source only: Maven clean verify + JUnit reports
# Does NOT build or push Docker images; CD owns image creation.
# No secrets required.
# ---------------------------------------------------------------------------

trigger:
  batch: true
  branches:
    include:
      - main
      - feat/*
  paths:
    include:
      - services/backend/**
      - azure-pipelines/ci/ci-backend.yaml
      - azure-pipelines/templates/**
      - azure-pipelines/scripts/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - services/backend/**
      - azure-pipelines/ci/ci-backend.yaml
      - azure-pipelines/templates/**
      - azure-pipelines/scripts/**

pool:
  vmImage: "ubuntu-24.04"

variables:
  - name: MAVEN_CACHE_FOLDER
    value: "$(Pipeline.Workspace)/.m2/repository"

steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    fetchTags: false
    persistCredentials: false
    submodules: false
    lfs: false

  - bash: |
      set -euo pipefail
      java -version
      mvn -version
    displayName: "Preflight hosted agent"

  - task: Cache@2
    displayName: "Cache Maven repository"
    inputs:
      key: 'maven | "$(Agent.OS)" | services/backend/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: "$(MAVEN_CACHE_FOLDER)"

  - task: Maven@4
    displayName: "Build and test backend"
    inputs:
      mavenPomFile: "services/backend/pom.xml"
      goals: "clean verify"
      options: "-B -ntp -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)"
      publishJUnitResults: true
      testResultsFiles: "**/target/surefire-reports/TEST-*.xml"
      testRunTitle: "Backend Tests"
      javaHomeOption: "JDKVersion"
      jdkVersionOption: "1.21"
      jdkArchitectureOption: "x64"
      mavenVersionOption: "Default"
      mavenAuthenticateFeed: false
